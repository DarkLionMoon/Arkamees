# ════════════════════════════════════
# ARCAMIS — Cloudflare Pages config
# ════════════════════════════════════
#
# NON usare "wrangler deploy" — il deploy avviene
# automaticamente tramite Cloudflare Pages (push su GitHub).
#
# Per impostare il token Notion:
#   Dashboard Cloudflare → Pages → arkamees
#   → Settings → Environment Variables → Add variable
#   Nome: NOTION_TOKEN   Tipo: Secret   Valore: secret_xxx...

name                    = "arkamees"
compatibility_date      = "2024-01-01"
pages_build_output_dir  = "."
