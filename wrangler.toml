# ════════════════════════════════════
# ARCAMIS — Cloudflare Worker config
# Optimized for CI/CD and Production
# ════════════════════════════════════

# Allineato al nome atteso dal sistema CI (come da log precedente)
name            = "arkamees" 
main            = "functions/notion-worker.js"
compatibility_date = "2024-01-01"

[vars]
# NOTION_TOKEN deve rimanere un Secret (wrangler secret put)

# RIMOZIONE [[routes]]: I sottodomini .pages.dev non supportano 
# rotte dirette da Worker esterni tramite config.

[observability]
enabled = true # Best practice per monitorare i proxy in produzione
